[package]
name = "nix-rust-future"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "LGPL-2.1-or-later"
description = "The Rust side of the C ABI futures of Nix (`nix/rust/future-abi.h`)"

# A crate of its own, without the cxx bridges and the C++ code of `nix-rust`,
# so that `nix-rust-test-support` can drive the same futures from a second
# Rust staticlib. That staticlib must not contain a copy of the C++ code of
# `libnixrust`.

[dependencies]
cxx = { version = "1.0", optional = true }

[features]
# `cxx::ExternType` for `nix_future` and `nix_waker`, so that a cxx bridge
# can pass them by value, and the conversion from `cxx::Exception`. The cxx
# crate brings the C++ runtime of cxx, which `nix-rust-test-support` must not
# contain.
cxx = ["dep:cxx"]
