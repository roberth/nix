[package]
name = "nix-rust"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "LGPL-2.1-or-later"
description = "The Rust part of Nix, linked into the process exactly once"

[lib]
# Meson wraps this archive into `libnixrust` (shared or static); see
# `meson.build` and `doc/manual/source/development/rust.md`.
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
crc32fast = "1"
cxx = "1.0"
gix-hash = { version = "0.28", features = ["sha1"] }
gix-object = "0.66"
gix-odb = { version = "0.86.0", features = ["sha1"] }
gix-pack = { version = "0.76", default-features = false, features = ["sha1", "parallel", "pack-cache-lru-static"] }
gix-zlib = "0.3.0"
nix-rust-future = { path = "future", features = ["cxx"] }
tempfile = "3"
# The reactor (`src/reactor.rs`): a single-threaded runtime with timers and fd
# readiness. No `signal` feature: Nix handles signals itself.
tokio = { version = "1.53", default-features = false, features = ["rt", "time", "net", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cxx-build = "1.0"

[lints]
workspace = true

[workspace]
# One lock file, and `cargo clippy --workspace` checks both crates.
members = [".", "future"]

[workspace.lints.rust]
# Each unsafe operation in an `unsafe fn` needs its own `unsafe` block,
# with its own `SAFETY` comment.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
# Meson strips and splits debug info itself.
debug = "line-tables-only"
